pageName: "AI Dialogue"
pageDescription: "Free-text conversations with NPCs in the dialogue window, using a local LLM server."

generalGroup: "General"

enabled: "Enable AI Dialogue"
enabledDescription: "Shows a text box in the dialogue window for talking to NPCs in your own words."

replyTokens: "Maximum Reply Length"
replyTokensDescription: |
    Longest reply the NPC can give, in tokens (roughly three quarters of a word each).
    (default: 170)

temperature: "Temperature"
temperatureDescription: |
    Higher values give more varied, less predictable replies.
    (default: 0.85)

advancedGroup: "Advanced"

contextSize: "Context Size"
contextSizeDescription: |
    Must match the context size the LLM server was started with (llama-server -c).
    Every prompt limit (card, scene and history size) is derived from it.
    (default: 8192)

sceneDetail: "Scene Detail"
sceneDetailDescription: |
    How much the NPC is told about the surroundings.
      Off: nothing.
      Brief: the place, the time and the two of you.
      Full: also nearby people, doors and things in view.
off: "Off"
brief: "Brief"
full: "Full"

scenePosition: "Scene Note Position"
scenePositionDescription: |
    Where the scene description goes in the prompt.
      System: with the character description at the start.
      Before Last Message: right before your latest line, which small models may follow more closely.
system: "System"
beforeLastMessage: "Before Last Message"

thinking: "{name} is thinking..."
serverError: "(The AI server could not be reached: {error})"
recall: "Recall"
earlierConversation: "Earlier conversation"
nowHeading: "Now"

template: "Instruct Template"
templateDescription: |
    The prompt format the model was trained on. Check the model card.
      Gemma 4: Gemma 4 models and fine-tunes.
      Metharme: many Mistral Nemo role-play fine-tunes, such as Rocinante.
      Mistral Tekken: Mistral Nemo models using the Mistral v3 Tekken format.
gemma4: "Gemma 4"
metharme: "Metharme"
mistralTekken: "Mistral Tekken"

itemRemoved: "{item} has been removed from your inventory."
itemAdded: "{item} has been added to your inventory."
giveChoice: "Give {item}"
keepChoice: "Keep it"
acceptChoice: "Accept {item}"
refuseChoice: "Refuse"
chooseHint: "Choose an answer above."
followChoice: "Take {name} along"
neverMindChoice: "Never mind"
followNotice: "{name} is now following you."
waitNotice: "{name} will wait here."
dismissNotice: "{name} is heading home."
